# Pushing a tag x.y.z (no "v" prefix) that equals manifest.json's version tests and builds the plugin,
# then creates a DRAFT GitHub release with main.js, manifest.json and styles.css attached.
# main.js and styles.css get GitHub build-provenance attestations. Review the draft, then publish it.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches manifest.json and versions.json
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match manifest.json version $version"
            exit 1
          fi
          if ! cmp -s manifest.json obsidian/manifest.json; then
            echo "::error::manifest.json and obsidian/manifest.json differ"
            exit 1
          fi
          node -e "const v=require('./versions.json'); if (!v[process.argv[1]]) { console.error('::error::versions.json has no entry for ' + process.argv[1]); process.exit(1); }" "$tag"
      - run: pnpm test
      - run: pnpm build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            obsidian/dist/main.js
            obsidian/dist/styles.css
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes "Readside ${GITHUB_REF_NAME}" \
            obsidian/dist/main.js manifest.json obsidian/dist/styles.css
